<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Lab &mdash; Commander e Standard</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #faf9f7; --panel: #fff; --ink: #1b1a18; --muted: #6b6862;
  --line: #e3e0da; --accent: #b4530a; --good: #2a78d6; --bad: #d03b3b;
  --seq: #2a78d6; --w:#e9dfc0; --u:#2a78d6; --b:#4a4642; --r:#e34948; --g:#008300;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#141311; --panel:#1d1c19; --ink:#eceae5; --muted:#9a958c;
          --line:#302e2a; --accent:#e8863a; --good:#3987e5; --bad:#e66767;
          --seq:#3987e5; --w:#cdbf95; --u:#3987e5; --b:#8d8880; --r:#e66767; --g:#3ca03c; }
}
:root[data-theme="dark"] { --bg:#141311; --panel:#1d1c19; --ink:#eceae5;
  --muted:#9a958c; --line:#302e2a; --accent:#e8863a; --good:#3987e5; --bad:#e66767;
  --seq:#3987e5; --w:#cdbf95; --u:#3987e5; --b:#8d8880; --r:#e66767; --g:#3ca03c; }
:root[data-theme="light"] { --bg:#faf9f7; --panel:#fff; --ink:#1b1a18;
  --muted:#6b6862; --line:#e3e0da; --accent:#b4530a; --good:#2a78d6; --bad:#d03b3b;
  --seq:#2a78d6; --w:#e9dfc0; --u:#2a78d6; --b:#4a4642; --r:#e34948; --g:#008300; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif,
  system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width:1180px; margin:0 auto; padding:32px 20px 80px; }
h1 { font-size:26px; margin:0 0 6px; letter-spacing:-.01em; }
h2 { font-size:17px; margin:38px 0 4px; letter-spacing:-.01em; }
.sub { color:var(--muted); font-size:14px; margin:0 0 4px; }
.note { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:6px; padding:12px 14px; margin:16px 0 8px; font-size:13.5px; color:var(--muted); }
.note strong { color:var(--ink); }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:18px 0 4px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
.tile b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); font-weight:600; margin-bottom:4px; }
.tile span { font-size:22px; line-height:1.1; }
.tile em { font-style:normal; font-size:12px; color:var(--muted); }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 4px; }
.tabs button { display:flex; align-items:baseline; gap:7px; padding:8px 16px; border-radius:8px;
  font-size:14px; font-weight:600; }
.tabs button em { font-style:normal; font-size:11.5px; font-weight:400; opacity:.72; }
.controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:18px 0 10px; }
button { font:inherit; font-size:13px; padding:6px 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); }
button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
.scroll { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
table { border-collapse:collapse; width:100%; font-size:13.5px; }
th, td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
th { font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); position:sticky; top:0; background:var(--panel); }
th.sortable { cursor:pointer; }
th.sortable:hover { color:var(--ink); }
tbody tr { cursor:pointer; }
tbody tr:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
tbody tr.sel { background:color-mix(in srgb, var(--accent) 14%, transparent); }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
/* Valor ao lado da barra, nao dentro dela: numero sobre o proprio preenchimento
   so e legivel por acaso, e com `mix-blend-mode` deixa de ser legivel nos dois
   temas ao mesmo tempo. */
.barwrap { display:flex; align-items:center; gap:8px; }
.barwrap > .bar { flex:1; }
.barwrap > span { font-size:11.5px; font-variant-numeric:tabular-nums;
  color:var(--ink); min-width:30px; text-align:right; }
.bar { position:relative; height:14px; min-width:80px; background:var(--line); border-radius:4px; }
.bar > i { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:4px; }
.chip { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11.5px;
  border:1px solid var(--line); color:var(--muted); }
.chip.b5 { border-color:var(--accent); color:var(--accent); font-weight:600; }
.pip { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
  border-radius:50%; font-size:10px; font-weight:700; margin-right:2px; color:#fff;
  border:1px solid rgba(0,0,0,.18); vertical-align:-3px; }
.pip.W { background:var(--w); color:#241f14; } .pip.U { background:var(--u); }
.pip.B { background:var(--b); } .pip.R { background:var(--r); } .pip.G { background:var(--g); }
.up { color:var(--good); } .down { color:var(--bad); }
.mx td, .mx th { padding:0; }
.mx th.rh { padding:4px 8px; font-size:11.5px; text-transform:none; letter-spacing:0;
  color:var(--ink); font-weight:500; white-space:nowrap; }
.mx th.ch { height:104px; vertical-align:bottom; padding-bottom:6px; }
.mx th.ch > div { writing-mode:vertical-rl; transform:rotate(180deg); font-size:11.5px;
  font-weight:500; color:var(--ink); text-transform:none; letter-spacing:0; }
.cell { width:32px; height:26px; text-align:center; font-size:10.5px; font-variant-numeric:tabular-nums;
  border:1px solid var(--bg); cursor:default; }
.cell.self { background:var(--line); }
.legend { display:flex; gap:14px; align-items:center; font-size:12.5px; color:var(--muted); margin:10px 2px; }
.sw { display:inline-block; width:26px; height:12px; border-radius:2px; vertical-align:-1px; margin-right:4px; }
#detail { margin-top:14px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:16px 18px; }
#detail h3 { margin:0 0 2px; font-size:16px; }
#detail .cmd { color:var(--muted); font-size:13px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px 22px; }
.metric { font-size:12.5px; }
.metric b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); font-weight:600; margin-bottom:3px; }
.curve { display:flex; align-items:flex-end; gap:6px; height:110px; margin:6px 0 4px; }
.curve > div { flex:1; display:flex; flex-direction:column; justify-content:flex-end;
  align-items:center; height:100%; gap:3px; }
.curve i { display:block; width:100%; background:var(--seq); border-radius:4px 4px 0 0; min-height:2px; }
.curve u { text-decoration:none; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.curve b { font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
.gcs { margin-top:14px; font-size:12.5px; color:var(--muted); line-height:1.7; }
.gcs code { background:var(--bg); border:1px solid var(--line); border-radius:3px;
  padding:1px 5px; font-size:11.5px; color:var(--ink); }
.gcs.warn { border-left:3px solid var(--bad); padding-left:10px; }
.mus { display:grid; grid-template-columns:1fr 1fr; gap:6px 22px; font-size:12.5px; margin-top:6px; }
.mus span { display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding:2px 0; }
footer { margin-top:44px; padding-top:16px; border-top:1px solid var(--line);
  color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Deck Lab</h1>
  <p class="sub" id="sub"></p>
  <div class="tabs" id="tabs"></div>
  <div id="aviso"></div>

  <div class="note" id="note"></div>
  <div id="tiles"></div>

  <div class="controls">
    <span id="tglslot"></span>
    <button id="theme">Alternar tema</button>
  </div>

  <h2>Ranking de forca</h2>
  <p class="sub">Clique numa linha para ver o detalhe do deck; clique num cabecalho para reordenar.</p>
  <div class="scroll"><table id="rank"><thead><tr></tr></thead><tbody></tbody></table></div>

  <div id="detail"></div>

  <h2>Matriz de matchup</h2>
  <p class="sub">Linha contra coluna. Azul = a linha tende a levar vantagem. Passe o mouse para ver o porque.</p>
  <div class="legend">
    <span><i class="sw" style="background:linear-gradient(90deg,var(--bad),var(--line),var(--good))"></i>
      desvantagem &rarr; equilibrio &rarr; vantagem</span>
    <span>escala -30 a +30</span>
  </div>
  <div class="scroll"><table class="mx" id="mx"></table></div>

  <footer id="foot"></footer>
</div>

let FMT = "standard";
let showRef = false, selected = null, sortKey = 'index', sortDir = -1;

const B = () => BUNDLE[FMT];
const visible = () => B().data.filter(d => showRef || !d.declared_b5);
const DATA_ = () => B().data;
const short = n => n.replace(/^(\d+\.\s*|z\.)/, '').replace(/\s*\[B5\]/, '');
const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const pips = cs => (cs || []).map(c => `<span class="pip ${c}">${c}</span>`).join('') || '<span class="chip">C</span>';
const signed = v => `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${v.toFixed(1)}</span>`;

function colorFor(v) {
  const t = Math.max(-1, Math.min(1, v / 30));
  const c = t >= 0 ? 'var(--good)' : 'var(--bad)';
  return `color-mix(in srgb, ${c} ${Math.round(Math.abs(t) * 72)}%, transparent)`;
}

function cell(d, [key, , kind]) {
  const v = get(d, key);
  switch (kind) {
    case 'deck': return `<td>${short(d.name)} ${d.declared_b5 ? '<span class="chip b5">B5</span>' : ''}</td>`;
    case 'leaders': return `<td>${(v || []).map(short).join(' + ')}</td>`;
    case 'colors': return `<td>${pips(v)}</td>`;
    case 'chip': return `<td>${v ? `<span class="chip">${v}</span>` : ''}</td>`;
    case 'bar': return `<td><div class="barwrap"><div class="bar"><i style="width:${v}%"></i></div>
      <span>${v}</span></div></td>`;
    case 'signed': return `<td class="num">${signed(v || 0)}</td>`;
    case 'clock': return `<td class="num" title="${esc(d.clock.nota)}">${v || '&middot;'}</td>`;
    case 'num1': return `<td class="num">${v == null ? '&middot;' : v.toFixed(1)}</td>`;
    case 'num2': return `<td class="num">${v == null ? '&middot;' : v.toFixed(2)}</td>`;
    case 'dot': return `<td class="num">${v ? v : '&middot;'}</td>`;
    case 'pct': return `<td class="num">${v == null ? '&middot;' : v + '%'}</td>`;
    case 'money': return `<td class="num">${v == null ? '&middot;' : '$' + Math.round(v)}</td>`;
    default: return `<td class="num">${v == null ? '&middot;' : v}</td>`;
  }
}

function renderRank() {
  const COLS = B().cols;
  const numeric = new Set(['num', 'num1', 'num2', 'dot', 'pct', 'money', 'bar', 'signed']);
  document.querySelector('#rank thead tr').innerHTML = '<th>#</th>' + COLS.map(([key, label, kind, tip]) =>
    `<th class="sortable ${numeric.has(kind) ? 'num' : ''}" data-key="${key}"
       title="${esc(tip || 'ordenar')}">${label}${sortKey === key ? (sortDir < 0 ? ' &darr;' : ' &uarr;') : ''}</th>`).join('');
  const rows = visible().slice().sort((a, b) => {
    const x = get(a, sortKey), y = get(b, sortKey);
    if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y)) * -sortDir;
    return ((y ?? -1) - (x ?? -1)) * (sortDir < 0 ? 1 : -1);
  });
  document.querySelector('#rank tbody').innerHTML = rows.map((d, i) => `
    <tr data-slug="${d.slug}" class="${d.slug === selected ? 'sel' : ''}">
      <td class="num">${i + 1}</td>${COLS.map(c => cell(d, c)).join('')}</tr>`).join('');
  document.querySelectorAll('#rank tbody tr').forEach(tr =>
    tr.onclick = () => { selected = tr.dataset.slug; renderRank(); renderDetail(); });
  document.querySelectorAll('#rank th.sortable').forEach(th =>
    th.onclick = () => {
      if (sortKey === th.dataset.key) sortDir = -sortDir; else { sortKey = th.dataset.key; sortDir = -1; }
      renderRank();
    });
}

const metric = (label, val) => `<div class="metric"><b>${label}</b>${val}</div>`;

function subscores(d) {
  return Object.entries(d.subscores).map(([k, v]) =>
    `<div class="metric"><b>${k.replace(/_/g, ' ')}</b>
      <div class="barwrap"><div class="bar"><i style="width:${v}%"></i></div>
        <span>${v}</span></div></div>`).join('');
}

function curveChart(p) {
  const buckets = ['0', '1', '2', '3', '4', '5', '6', '7'];
  const max = Math.max(...buckets.map(b => p.curva[b] || 0), 1);
  return `<div class="curve">${buckets.map(b => {
    const n = p.curva[b] || 0;
    return `<div title="${n} carta(s) de custo ${b === '7' ? '7 ou mais' : b}">
      <b>${n || ''}</b><i style="height:${Math.round(n / max * 78)}%"></i>
      <u>${b === '7' ? '7+' : b}</u></div>`;
  }).join('')}</div>`;
}

function matchupList(d) {
  const all = Object.entries(d.matchups)
    .filter(([s]) => showRef || !DATA_().find(x => x.slug === s).declared_b5)
    .map(([s, m]) => [short(DATA_().find(x => x.slug === s).name), m.score])
    .sort((a, b) => b[1] - a[1]);
  const line = ([n, v]) => `<span><em style="font-style:normal">${n}</em>${signed(v)}</span>`;
  return `<div class="mus">
    <div><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">Melhores matchups</b>
      ${all.slice(0, 5).map(line).join('')}</div>
    <div><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">Piores matchups</b>
      ${all.slice(-5).reverse().map(line).join('')}</div></div>`;
}

function renderDetail() {
  const d = DATA_().find(x => x.slug === selected);
  const box = document.getElementById('detail');
  if (!d) { box.innerHTML = '<p class="sub" style="margin:0">Nenhum deck selecionado.</p>'; return; }
  box.innerHTML = FMT === 'standard' ? detailStandard(d) : detailCommander(d);
}

function detailStandard(d) {
  const p = d.profile;
  const conformidade = [];
  if (p.cards_resolved !== 60) conformidade.push(`main com <code>${p.cards_resolved}</code> cartas, nao 60`);

  if (p.illegal) conformidade.push(`fora do Standard atual: ${p.illegal_names.map(n => `<code>${n}</code>`).join(' ')}`);
  return `
    <h3>${short(d.name)} &mdash; indice ${d.index} &middot; ${d.archetype}</h3>
    <div class="cmd">${pips(p.colors)} &nbsp;
      <b>Clock:</b> ${d.clock.faixa ? `${d.clock.faixa} &mdash; ${d.clock.nota}` : d.clock.nota}
      &nbsp;&middot;&nbsp; <b>Saldo contra o pod:</b> ${signed(d.field_score)}</div>
    <div class="metric" style="margin-bottom:14px"><b>Curva de mana (nao-terreno)</b>${curveChart(p)}</div>
    <div class="grid">
      ${metric('Terrenos', `${p.lands} &middot; ${p.lands_untapped} desvirados &middot; ${p.lands_dual} duplos`)}
      ${metric('Criaturas', `${p.creatures} &middot; poder impresso ${p.creature_power}`)}
      ${metric('Poder do plano', `${p.threat_power} &middot; ${p.pump_power} vem de aura/equip./contador`)}
      ${metric('Protecao concedida', p.protection)}
      ${metric('CMC medio', p.avg_cmc.toFixed(2))} ${metric('Playsets (4 copias)', p.playsets)}
      ${metric('Remocao', p.removal)} ${metric('Contramagias', p.counterspells)}
      ${metric('Sweepers', p.sweepers)} ${metric('Interacao (total)', p.interaction)}
      ${metric('Compra', p.draw)} ${metric('Recursao', p.recursion)}
      ${metric('Evasao', p.evasion)} ${metric('Haste', p.haste)}
      ${metric('Queima ao rosto', p.burn)} ${metric('Ganho de vida', p.lifegain)}
      ${metric('Fichas', p.tokens_made)} ${metric('Artefatos', p.artifacts)}
      ${metric('Dep. cemiterio', p.gy_reliance)} ${metric('Odio a cemiterio', p.gy_hate)}
      ${metric('Manabase', p.manabase_pct + '%')} ${metric('Preco aprox.', '$' + Math.round(p.price_usd))}
    </div>
    <h3 style="margin-top:20px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Subscores</h3>
    <div class="grid">${subscores(d)}</div>
    <h3 style="margin-top:20px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Contra o pod</h3>
    ${matchupList(d)}
    ${conformidade.length ? `<div class="gcs warn"><b>Conformidade</b><br>${conformidade.join('<br>')}</div>`
      : '<div class="gcs"><b>Conformidade:</b> 60 cartas, limite de 4 copias respeitado, tudo legal no Standard atual.</div>'}
    ${p.two_card_combos ? `<div class="gcs"><b>Combos de 2 cartas catalogados (${p.two_card_combos})</b>
      <em>&mdash; fora do indice: a base do Commander Spellbook cobre Standard de forma desigual,
      e premiar o combo que por acaso foi catalogado seria premiar a cobertura, nao o deck</em><br>
      ${p.two_card_list.map(n => `<code>${n}</code>`).join(' ')}</div>` : ''}
    <div class="gcs"><b>Lista</b><br>${d.cards.map(c => `<code>${c.q}&times; ${c.n}</code>`).join(' ')}</div>`;
}

function detailCommander(d) {
  const p = d.profile;
  return `
    <h3>${short(d.name)} &mdash; indice ${d.index} &middot; ${d.bracket_label}
      &middot; power level ${d.power_level.toFixed(1)}</h3>
    <div class="cmd">${d.commanders.join(' + ')}<br>
      <b>Clock:</b> ${d.clock.faixa
        ? `${d.clock.faixa} &mdash; ${d.clock.nota} (par mais barato custa ${d.clock.custo_par_mais_barato} de mana)`
        : d.clock.nota}</div>
    <div class="grid">
      ${metric('Game Changers', p.game_changers)}
      ${metric('Combos de 2 cartas', p.two_card_combos +
         (p.two_card_with_commander ? ` (${p.two_card_with_commander} com o comandante)` : ''))}
      ${metric('Mass Land Denial', p.mld)} ${metric('Turnos extras', p.extra_turns)}
      ${metric('Terrenos', p.lands)} ${metric('Criaturas', p.creatures)}
      ${metric('Artefatos', p.artifacts)} ${metric('CMC medio', p.avg_cmc.toFixed(2))}
      ${metric('Mana rapida', p.fast_mana)} ${metric('Tutores', p.tutors)}
      ${metric('Remocao', p.removal)} ${metric('Contramagias', p.counterspells)}
      ${metric('Sweepers', p.sweepers)} ${metric('Compra', p.draw)}
      ${metric('Protecao', p.protection)} ${metric('Pecas de combo', p.combo_pieces)}
      ${metric('Dep. cemiterio', p.gy_reliance)} ${metric('Odio a cemiterio', p.gy_hate)}
      ${metric('Stax / taxa', p.stax)} ${metric('Magias gratis', p.free_spells)}
    </div>
    <h3 style="margin-top:20px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Subscores</h3>
    <div class="grid">${subscores(d)}</div>
    <div class="gcs"><b>Game Changers (${p.game_changers}):</b><br>
      ${p.game_changer_names.map(n => `<code>${n}</code>`).join(' ') || '<em>nenhum</em>'}</div>
    <div class="gcs"><b>Combos de 2 cartas (${p.two_card_combos}):</b><br>
      ${p.two_card_list.map(n => `<code>${n}</code>`).join(' ') || '<em>nenhum catalogado</em>'}</div>
    ${p.mld ? `<div class="gcs"><b>Mass Land Denial (${p.mld}):</b><br>
      ${p.mld_names.map(n => `<code>${n}</code>`).join(' ')}</div>` : ''}
    ${p.extra_turns ? `<div class="gcs"><b>Turnos extras (${p.extra_turns}):</b><br>
      ${p.extra_turn_names.map(n => `<code>${n}</code>`).join(' ')}</div>` : ''}
    ${d.edhrec ? `<div class="gcs">
      <b>Perfil EDHREC</b> <em>(caracterizacao do build, fora do indice de forca)</em><br>
      ${d.edhrec.spice_pct}% das cartas nao aparecem nas listas do comandante &middot;
      ${d.edhrec.stock_50} cartas jogadas por 50%+ dos decks &middot;
      inclusao media ${d.edhrec.inclusao_media}%<br>
      <b>Como a comunidade distribui este comandante:</b>
      ${Object.entries(d.edhrec.bracket_counts).sort().map(([b, n]) =>
        `<code>B${b}: ${n}</code>`).join(' ') || '<em>sem dados</em>'}<br>
      <b>Temas:</b> ${Object.entries(d.edhrec.temas).map(([t, n]) =>
        `<code>${t} ${n}</code>`).join(' ') || '<em>sem dados</em>'}</div>` : ''}`;
}

function renderMatrix() {
  const ds = visible();
  const head = `<tr><th class="rh"></th>${ds.map(d =>
    `<th class="ch"><div>${short(d.name)}</div></th>`).join('')}</tr>`;
  const body = ds.map(a => `<tr><th class="rh">${short(a.name)}</th>${ds.map(b => {
    if (a.slug === b.slug) return '<td class="cell self"></td>';
    const m = a.matchups[b.slug];
    const why = m.drivers.map(x => `${x.eixo} ${x.peso > 0 ? '+' : ''}${x.peso}`).join(' · ');
    return `<td class="cell" style="background:${colorFor(m.score)}"
      title="${short(a.name)} vs ${short(b.name)}: ${m.score > 0 ? '+' : ''}${m.score}\n${why}">
      ${m.score > 0 ? '+' : ''}${Math.round(m.score)}</td>`;
  }).join('')}</tr>`).join('');
  document.getElementById('mx').innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
}

/* Cabecalho, aviso, tiles, rodape e o botao de decks de referencia sao todos
   por formato: trocar de aba troca a pagina inteira, nao so a tabela. */
function renderChrome() {
  const b = B(), fmts = Object.keys(BUNDLE);
  document.getElementById('tabs').innerHTML = fmts.length < 2 ? '' : fmts.map(f =>
    `<button data-fmt="${f}" aria-pressed="${f === FMT}">${BUNDLE[f].label}
      <em>${BUNDLE[f].npod} decks</em></button>`).join('');
  document.querySelectorAll('#tabs button').forEach(bt => bt.onclick = () => {
    if (bt.dataset.fmt === FMT) return;
    FMT = bt.dataset.fmt; showRef = false; selected = null; sortKey = 'index'; sortDir = -1;
    renderAll();
  });
  document.getElementById('sub').innerHTML = b.sub;
  document.getElementById('aviso').innerHTML = b.aviso;
  document.getElementById('note').innerHTML = b.note;
  document.getElementById('tiles').innerHTML = b.tiles;
  document.getElementById('foot').innerHTML = b.footer +
    ' Gerado por <code>MTG/deck-lab/scripts/build_html.py</code>.';
  document.getElementById('tglslot').innerHTML = !b.ref ? '' :
    `<button id="tgl" aria-pressed="false">Incluir os ${b.ref} decks ${b.refMarker} de referencia</button>`;
  const tgl = document.getElementById('tgl');
  if (tgl) tgl.onclick = e => {
    showRef = !showRef;
    e.target.setAttribute('aria-pressed', String(showRef));
    e.target.textContent = showRef ? 'Mostrar so o pod'
      : `Incluir os ${b.ref} decks ${b.refMarker} de referencia`;
    renderRank(); renderMatrix(); renderDetail();
  };
}

document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

function renderAll() { renderChrome(); renderRank(); renderDetail(); renderMatrix(); }
renderAll();
</script>
</body>
</html>
